<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discover Matches - Unirade</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <nav>
            <span class="logo">🖤 Unirade</span>
            <a href="index.html">Home</a>
            <a href="discover.html">Browse Matches</a>
            <a href="login.html">Login/Signup</a>
            <button id="themeToggle">🌓</button>
        </nav>
    </header>
    <main>
        <h2>Discover Students</h2>
        <p>Only profiles from your university are shown.</p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search students by name..." />
        </div>
        <section class="filters">
            <label>Age: <input type="range" id="ageFilter" min="16" max="100" value="30" /></label>
            <label>Course: <input type="text" id="courseFilter" placeholder="e.g. Computer Science" /></label>
            <label>Year: <input type="number" id="yearFilter" min="1" max="10" /></label>
            <label>Interests: <input type="text" id="interestsFilter" placeholder="e.g. music, coding" /></label>
        </section>
        <section class="card-stack" id="cardStack">
            <!-- Swipeable cards will be injected here by JS -->
        </section>
    </main>
    <footer>
        <p>Contact: <a href="mailto:contact@unirade.example">contact@unirade.example</a> | <a href="#">Privacy Policy</a></p>
        <p>
            Follow us:
            <a href="#">Facebook</a> |
            <a href="#">Twitter</a> |
            <a href="#">Instagram</a>
        </p>
        <p>&copy; 2026 Unirade. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>

</html>
